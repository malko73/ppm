<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ APP_NAME }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'project_list' %}">{{ APP_NAME }}</a>
        <div class="d-flex align-items-center gap-2">
            {% if request.user.is_authenticated %}
                <span class="text-muted small">{{ request.user.email }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
                </form>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container py-4 flex-grow-1">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
<footer class="border-top bg-white py-2">
    <div class="container text-end text-muted small">
        Version {{ APP_VERSION }}
    </div>
</footer>
</body>
</html>
