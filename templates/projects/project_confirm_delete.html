{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h1 class="h5">プロジェクト削除</h1>
        <p>「{{ object.title }}」を削除しますか？</p>
        <form method="post">{% csrf_token %}
            <button class="btn btn-danger" type="submit">削除する</button>
            <a class="btn btn-secondary" href="{% url 'project_detail' object.pk %}">キャンセル</a>
        </form>
    </div>
</div>
{% endblock %}
