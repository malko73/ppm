{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">プロジェクト一覧</h1>
    <a href="{% url 'project_create' %}" class="btn btn-primary">新規プロジェクト</a>
</div>
<div class="row g-3">
    {% for project in projects %}
    <div class="col-md-6">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h2 class="h5">{{ project.title }}</h2>
                <p class="text-muted small mb-3">{{ project.description|default:'-' }}</p>
                <a class="btn btn-outline-primary btn-sm" href="{% url 'project_detail' project.pk %}">開く</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-secondary">まだプロジェクトがありません。</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
