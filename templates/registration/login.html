{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">ログイン</h1>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">メールアドレス</label>
                        <input class="form-control" type="email" name="username" id="id_username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">パスワード</label>
                        <input class="form-control" type="password" name="password" id="id_password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">ログイン</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
